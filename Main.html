<!DOCTYPE html>
<html>
<head>
  <title>EOD Upload</title>
</head>
<body>

<h3>EOD Submission</h3>

<select id="eod">
  <option>1–5</option>
  <option>6–10</option>
  <option>11–15</option>
  <option>16–20</option>
  <option>21–25</option>
  <option>26–End</option>
</select>

<br><br>

<input id="opid" placeholder="Operator ID" onblur="getData()" />

<br><br>

<input id="name" placeholder="Name" readonly />
<input id="mode" placeholder="Mode" readonly />
<input id="district" placeholder="District" readonly />
<input id="address" placeholder="Address" readonly />

<br><br>

<input id="camp" placeholder="Camp Name" style="display:none;" />

<br><br>

<button onclick="submitEOD()">Submit</button>

<script>
const API = "https://script.google.com/macros/s/AKfycbxnrG0uj3qmgKRm1982E3aoqas4WhqpkXI35Pk26JJRvjyNKSGIyR_Vg0tRmpXUY-4v/exec";

function getData() {
  const id = document.getElementById("opid").value;
  fetch(API + "?operator_id=" + id)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        alert("Invalid Operator ID");
        return;
      }
      name.value = data.name;
      mode.value = data.mode;
      district.value = data.district;
      address.value = data.address;

      if (data.mode === "Camp") {
        camp.style.display = "block";
      } else {
        camp.style.display = "none";
      }
    });
}

function submitEOD() {
  fetch(API, {
    method: "POST",
    body: JSON.stringify({
      eod_period: eod.value,
      operator_id: opid.value,
      name: name.value,
      mode: mode.value,
      district: district.value,
      address: address.value,
      camp_name: camp.value
    })
  })
  .then(res => res.text())
  .then(msg => alert(msg));
}
</script>

</body>
</html>
